# A three-broker PulseLog cluster.
#
#   docker compose -f docker/docker-compose.yml up --build
#
# Every broker is given the same `cluster.brokers` list, because partition
# assignment is positional: a broker with a different list would compute
# different replica placements and the cluster would disagree with itself.
#
# Brokers advertise their service name, not 0.0.0.0, so peers and clients
# outside the container network can reach them by the name compose gives them.
#
# Environment variables use a SINGLE underscore per dot: PULSELOG_A_B sets key
# `a.b`. A doubled underscore is an escape for a literal underscore, so
# PULSELOG_CLUSTER__BROKERS sets `cluster_brokers`, which nothing reads. The
# broker now refuses to start on a key nobody consumes rather than silently
# running on defaults.
name: pulselog

x-broker-common: &broker-common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: unless-stopped
  networks: [pulselog]
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9644/health"]
    interval: 10s
    timeout: 3s
    retries: 3
    start_period: 5s

# Identical on every broker. Only the id and the advertised host differ, and
# those are set per service below; anything duplicated per service is a chance
# for two brokers to disagree.
x-broker-env: &broker-env
  PULSELOG_CLUSTER_BROKERS: "1@pulselog-1:9092,2@pulselog-2:9092,3@pulselog-3:9092"
  PULSELOG_NET_LISTEN: "0.0.0.0:9092"
  PULSELOG_NET_ADVERTISED_PORT: "9092"
  PULSELOG_METRICS_HOST: "0.0.0.0"
  PULSELOG_METRICS_PORT: "9644"
  PULSELOG_BROKER_DATA_DIR: "/var/lib/pulselog"
  PULSELOG_TOPICS_DEFAULT_PARTITIONS: "6"
  PULSELOG_TOPICS_DEFAULT_REPLICATION_FACTOR: "3"
  PULSELOG_LOG_LEVEL: "info"

services:
  pulselog-1:
    <<: *broker-common
    container_name: pulselog-1
    hostname: pulselog-1
    environment:
      <<: *broker-env
      PULSELOG_BROKER_ID: "1"
      PULSELOG_NET_ADVERTISED_HOST: "pulselog-1"
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - pulselog-1-data:/var/lib/pulselog

  pulselog-2:
    <<: *broker-common
    container_name: pulselog-2
    hostname: pulselog-2
    environment:
      <<: *broker-env
      PULSELOG_BROKER_ID: "2"
      PULSELOG_NET_ADVERTISED_HOST: "pulselog-2"
    ports:
      - "9093:9092"
      - "9645:9644"
    volumes:
      - pulselog-2-data:/var/lib/pulselog

  pulselog-3:
    <<: *broker-common
    container_name: pulselog-3
    hostname: pulselog-3
    environment:
      <<: *broker-env
      PULSELOG_BROKER_ID: "3"
      PULSELOG_NET_ADVERTISED_HOST: "pulselog-3"
    ports:
      - "9094:9092"
      - "9646:9644"
    volumes:
      - pulselog-3-data:/var/lib/pulselog

volumes:
  pulselog-1-data:
  pulselog-2-data:
  pulselog-3-data:

networks:
  pulselog:
    driver: bridge
