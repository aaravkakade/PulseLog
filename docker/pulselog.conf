# Example broker configuration.
#
# Every key here is at its default; the file exists so an operator can see the
# full surface in one place. Precedence is file < PULSELOG_* environment <
# command line, so anything set here can be overridden without editing it.

[broker]
id = 0
data.dir = ./pulselog-data
worker.threads = 2
worker.queue.capacity = 4096
pin.workers = false

[net]
listen = 0.0.0.0:9092
advertised.host = 127.0.0.1
advertised.port = 9092
io.threads = 2
max.connections = 4096
max.frame.bytes = 64MB
# 0 disables the idle sweep entirely.
idle.timeout = 0
output.high.water.bytes = 4MB
output.max.bytes = 64MB

[cluster]
# Positional: every broker must be given the same list, or they will compute
# different partition assignments.
# brokers = 1@host-a:9092,2@host-b:9092,3@host-c:9092

[storage]
segment.bytes = 128MB
segment.ms = -1
index.interval.bytes = 4096
retention.bytes = -1
retention.ms = -1
min.free.disk.bytes = 64MB
preallocate = true
write.mode = write
# full  = F_FULLFSYNC on macOS / fsync on Linux: on stable media.
# data  = fsync / fdatasync: on the device, maybe still in its volatile cache.
fsync.mode = full
# When true, every append fsyncs before it is acknowledged.
flush.sync.on.append = false
flush.interval = 200ms
flush.max.bytes = 4MB
flush.max.records = 10000
flusher.interval = 20ms
retention.check.interval = 30s

[topics]
auto.create = true
default.partitions = 1
default.replication.factor = 1

[replication]
interval = 2ms
timeout = 5s
max.bytes = 1MB
lag.max = 10s

[group]
session.timeout = 10s
rebalance.delay = 200ms

[metrics]
enabled = true
host = 0.0.0.0
port = 9644
sample.interval = 1s

[log]
level = info
