# CI runs on Linux, which is the deployment target. Development happens on
# macOS, so this is also where the epoll backend, fdatasync, and GCC's warning
# set get exercised at all -- a Linux-only failure here is a real platform
# difference, not flakiness.
#
# Toolchains are whatever ubuntu-latest ships. Pinning to a version the image
# does not have fails the job before a single line is compiled, which is a
# worse outcome than tracking the image; the versions actually used are printed
# by every build job.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_GENERATOR: Ninja

jobs:
  build-and-test:
    name: build+test (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            build_type: RelWithDebInfo
          - compiler: gcc
            cc: gcc
            cxx: g++
            build_type: Debug
          - compiler: clang
            cc: clang
            cxx: clang++
            build_type: RelWithDebInfo

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake

      - name: Report versions
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          echo "distro:   $(. /etc/os-release && echo "$PRETTY_NAME")"
          echo "kernel:   $(uname -r) $(uname -m)"
          echo "compiler: $($CXX --version | head -1)"
          echo "cmake:    $(cmake --version | head -1)"

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DPULSELOG_WERROR=ON

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Unit and integration tests
        run: ctest --test-dir build --output-on-failure -j2 --timeout 300

      - name: Confirm the epoll backend was used
        run: |
          # The poller is selected at compile time. A Linux build that somehow
          # chose kqueue would pass every test and validate nothing.
          ./build/bin/pulselog-broker --broker.data.dir=/tmp/epoll-check \
            --net.listen=127.0.0.1:19911 --metrics.enabled=false --log.level=info \
            > /tmp/backend.log 2>&1 &
          BROKER_PID=$!
          for _ in $(seq 1 50); do
            grep -q "broker started" /tmp/backend.log && break
            sleep 0.2
          done
          kill "$BROKER_PID" 2>/dev/null || true
          grep "poller=" /tmp/backend.log
          grep -q "poller=epoll" /tmp/backend.log \
            || { echo "expected the epoll backend on Linux"; cat /tmp/backend.log; exit 1; }

  sanitizers:
    name: sanitizer (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address+undefined, thread]

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake clang

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-san \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPULSELOG_SANITIZER=${{ matrix.sanitizer }} \
            -DPULSELOG_BUILD_BENCHMARKS=OFF \
            -DPULSELOG_WERROR=ON

      - name: Build
        run: cmake --build build-san -j"$(nproc)"

      - name: Cluster failure injection under the sanitizer
        # The failure paths are the ones least covered by the unit tests and
        # most likely to touch freed memory: a follower dying mid-batch, a
        # connection reset while a response is queued, shutdown while workers
        # are draining. Running them here is the point of having them.
        if: matrix.sanitizer == 'address+undefined'
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: BUILD_DIR=build-san scripts/failure_cluster_test.sh

      - name: Run tests under the sanitizer
        env:
          # halt_on_error keeps the first ASan/UBSan report as the failure
          # rather than burying it under later ones. TSan is left running so a
          # single job surfaces every race it can find.
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=0:second_deadlock_stack=1
        run: ctest --test-dir build-san --output-on-failure -j1 --timeout 900

  formatting:
    name: clang-format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        # The version is pinned in .clang-format-version and installed from
        # PyPI, so this job and a developer's machine agree exactly. Without
        # pinning, two clang-format majors disagree forever about a file
        # neither of them touched.
        run: scripts/format.sh --check

  static-analysis:
    name: clang-tidy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake clang clang-tidy

      - name: Configure (for compile_commands.json)
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPULSELOG_BUILD_TESTS=OFF \
            -DPULSELOG_BUILD_BENCHMARKS=OFF

      - name: clang-tidy
        run: |
          clang-tidy --version
          # Only our own sources; fetched dependencies are not ours to lint.
          git ls-files 'src/*.cc' 'clients/cpp/src/*.cc' 'apps/*/*.cc' \
            | xargs clang-tidy -p build --warnings-as-errors='*'

  linux-smoke:
    name: Linux smoke + failure injection
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake curl

      - name: Build (release)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPULSELOG_WERROR=ON
          cmake --build build -j"$(nproc)"

      - name: Single-broker smoke test
        run: scripts/smoke_test.sh

      - name: Linux smoke test (epoll, cluster, replication, quorum, recovery)
        run: scripts/linux_smoke_test.sh

      - name: Failure injection (single broker)
        run: scripts/failure_test.sh

      - name: Failure injection (three-broker cluster)
        run: scripts/failure_cluster_test.sh

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            /tmp/pulselog-linux-smoke/
            /tmp/*.log
          if-no-files-found: ignore

  benchmarks:
    name: Linux x86-64 benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build cmake python3

      - name: Run the release benchmark suite
        # A GitHub-hosted runner is a shared VM: absolute numbers carry more
        # variance than dedicated hardware, which is why the report always
        # publishes the spread across trials alongside the median.
        run: scripts/benchmark_release.sh --trials 5 --out results-linux

      - name: Profile durable-mode tail latency
        # acks=quorum is the slow path and an end-to-end number gives no
        # purchase on it. This is also the only place the fsync-vs-fdatasync
        # comparison is meaningful: on macOS the 'data' mode falls through to
        # fsync, so the two modes are not the same experiment there.
        run: |
          python3 scripts/profile_durability.py \
            --build-dir build-release \
            --records 40000 \
            --trials 5 \
            --out results-linux/durability.json

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-benchmark-results
          path: results-linux/
          if-no-files-found: warn

  docker:
    name: docker image + 3-broker cluster
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f docker/Dockerfile -t pulselog:ci .

      - name: Start a three-broker cluster
        run: docker compose -f docker/docker-compose.yml up -d --wait --wait-timeout 180

      - name: Exercise it
        run: |
          docker compose -f docker/docker-compose.yml exec -T pulselog-1 \
            pulselog-cli create-topic ci-topic --partitions=6 --replication=3 \
            --brokers=pulselog-1:9092
          docker compose -f docker/docker-compose.yml exec -T pulselog-1 \
            pulselog-cli produce ci-topic --value=hello --count=500 --batch=50 \
            --acks=quorum --brokers=pulselog-1:9092
          docker compose -f docker/docker-compose.yml exec -T pulselog-2 \
            pulselog-cli metadata ci-topic --brokers=pulselog-2:9092
          docker compose -f docker/docker-compose.yml exec -T pulselog-3 \
            pulselog-cli offsets ci-topic --brokers=pulselog-3:9092

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker/docker-compose.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v
